services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${TEST_REDIS_PORT:-16379}:6379"]
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: food_test
    ports: ["127.0.0.1:${TEST_POSTGRES_PORT:-15432}:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "food_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redpanda:
    image: ${REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v26.2.5}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${TEST_KAFKA_PORT:-29092}
      - --unsafe-bypass-fsync=false
    volumes:
      - ./redpanda.bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
    ports: ["127.0.0.1:${TEST_KAFKA_PORT:-29092}:29092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 3s
      timeout: 5s
      retries: 40
    stop_grace_period: 30s
