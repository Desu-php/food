# Development-only overlay. See docs/auth-profile-oidc.md before starting.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-enabled=false"]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-https://identity.food.test:8443}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/server.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/server-key.pem
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set local KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set local KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8443}:8443"
    volumes:
      - ${OIDC_DEV_DIR:-../.local/oidc}/tls:/opt/keycloak/conf/tls:ro
      - ./oidc/food-realm.json:/opt/keycloak/data/import/food-realm.json:ro
      - keycloak_dev_data:/opt/keycloak/data
    networks:
      backend:
        aliases: [identity.food.test]
      edge: {}
    restart: unless-stopped

  catalog:
    environment: &oidc-env
      APP_ENV: development
      DEV_AUTH_ENABLED: "false"
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-https://identity.food.test:8443}/realms/food
      OIDC_JWKS_URL: https://identity.food.test:8443/realms/food/protocol/openid-connect/certs
      OIDC_AUDIENCE: food-api
      AUTH_IDENTITIES_FILE: /etc/food/identities.json
      SSL_CERT_FILE: /etc/food/dev-ca.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9000}
    volumes: &oidc-volumes
      - ${OIDC_DEV_DIR:-../.local/oidc}/identities.json:/etc/food/identities.json:ro
      - ${OIDC_DEV_DIR:-../.local/oidc}/ca.pem:/etc/food/dev-ca.pem:ro

  orders:
    environment: *oidc-env
    volumes: *oidc-volumes

  delivery:
    environment: *oidc-env
    volumes: *oidc-volumes

  notifications:
    environment: *oidc-env
    volumes: *oidc-volumes

volumes:
  keycloak_dev_data:
